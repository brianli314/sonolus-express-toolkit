services:
  sonolus:
    image: node:24-alpine
    container_name: sonolus-server 
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm ci && npm run build && npm start"
    restart: unless-stopped
    networks:
      - caddy
    user: "1000:1000"

networks:
  caddy:
    external: true